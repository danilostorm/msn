name: storm-msn
services:
  msn:
    container_name: storm-msn
    build: .
    restart: unless-stopped
    init: true
    network_mode: bridge
    ports:
      - "${MSN_LISTEN_ADDR:-127.0.0.1}:1863:1863"
      - "${MSN_LISTEN_ADDR:-127.0.0.1}:1864:1864"
      - "127.0.0.1:${MSN_HTTP_PORT:-18081}:8081"
    environment:
      MSN_PUBLIC_SIGNUP: "0"
      MSN_ADMIN_PASSWORD: "${MSN_ADMIN_PASSWORD:?Configure no arquivo .env}"
      MSN_SITE_PASSWORD: "${MSN_SITE_PASSWORD:-}"
      MSN_TARGET_HOST: "${MSN_TARGET_HOST:-127.0.0.1}"
      MSN_LOGIN_HOST: "${MSN_LOGIN_HOST:-}"
      MSN_STORAGE_HOST: "${MSN_STORAGE_HOST:-}"
    volumes:
      - ../data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',1863),timeout=4); s.close()"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
