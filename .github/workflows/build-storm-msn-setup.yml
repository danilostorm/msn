name: Storm MSN - Instalador Windows
on:
  push:
    branches: [main]
    paths:
      - installer/**
      - .github/workflows/build-storm-msn-setup.yml
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install --upgrade pyinstaller lief
      - name: Verificar fonte
        run: python -m py_compile installer/storm_msn_setup.py
      - name: Testar PE ImportMe
        shell: pwsh
        run: |
          @'
          import lief
          from pathlib import Path
          from installer.storm_msn_setup import import_loaded
          src = Path(r"C:\Windows\SysWOW64\notepad.exe")
          pe = lief.PE.parse(str(src))
          assert pe is not None and not import_loaded(pe)
          im = pe.add_import("escargot.dll")
          im.add_entry("ImportMe")
          config = lief.PE.Builder.config_t()
          config.imports = True
          pe.write("fixture.exe", config)
          patch = lief.PE.parse("fixture.exe")
          assert import_loaded(patch)
          print("PASS: Windows PE import ImportMe confirmado")
          '@ | Set-Content -Encoding utf8 test_importme.py
          python test_importme.py
      - name: Testar patch no wlcomm.exe REAL da instalacao oficial
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wlm2009-original.zip'
          Invoke-WebRequest -Uri 'https://storage.levelleap.com/nina/clients/msnp/patched-installer/msn/escargot-wlm-14.0.8117.0416-pt-br.zip' -OutFile $zip
          $h=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($h -ne '4aa347b352dc33d4628c4e85bdf2e702e72aaaaf2fd86206f2611942ab72f2f0') { throw "Checksum WLM mismatch" }
          $source=Join-Path $env:RUNNER_TEMP 'wlm_pkg'
          $outer=Join-Path $env:RUNNER_TEMP 'wlm_inner'
          New-Item -ItemType Directory -Path $source,$outer -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $source -Force
          $installer=Join-Path $source 'escargot-wlm-14.0.8117.0416-pt-br.exe'
          & 7z x -y "-o$outer" $installer | Out-Null
          if ($LASTEXITCODE -gt 1) { throw "Extracao NSIS falhou" }
          $contacts=Get-ChildItem $outer -Filter 'Contacts.msi' -Recurse -File | Select-Object -First 1
          if (-not $contacts) { throw "Contacts.msi nao encontrado" }
          $extracted=Join-Path $env:RUNNER_TEMP 'wlm_contacts'
          New-Item -ItemType Directory -Path $extracted -Force | Out-Null
          & 7z x -y "-o$extracted" $contacts.FullName | Out-Null
          if ($LASTEXITCODE -gt 1) { throw "Extracao CAB/MSI falhou" }
          $wlcomm=Get-ChildItem $extracted -Filter 'wlcomm' -Recurse -File | Select-Object -First 1
          if (-not $wlcomm -or $wlcomm.Length -ne 32768) { throw "wlcomm original inesperado" }
          $env:STORM_WLCOMM_FIXTURE=$wlcomm.FullName
          python -m unittest discover -s installer -p 'test_setup.py' -v
      - name: Validar o patch oficial NINA para Windows 11 24H2+
        shell: pwsh
        run: |
          $zip=Join-Path $env:RUNNER_TEMP 'EscargotWin24H2.zip'
          Invoke-WebRequest -Uri 'https://static.nina.chat/distro/EscargotWin24H2.zip' -OutFile $zip
          $digest=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne '125213062071f17aed267cde94ecfb3193ca21cacec2c82f257c0cfde1f17ae8') { throw "Patcher 24H2 integrity mismatch" }
          $env:STORM_WIN11_FIX_FIXTURE=$zip
          python -m unittest discover -s installer -p 'test_setup.py' -v
      - name: Testar Messenger Plus! sem senha (Storm MSN)
        shell: pwsh
        run: |
          $zip=Join-Path $env:RUNNER_TEMP 'StormMSN-MsgPlus-5.02.712.zip'
          Invoke-WebRequest -Uri 'https://msn.hoststorm.com.br/downloads/StormMSN-MsgPlus-5.02.712.zip' -OutFile $zip
          $digest=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'e5d897a04a8c51156b6226608d31fbf726d7434135a46ade768ad2955f0e7038') { throw 'Plus ZIP checksum mismatch' }
          $env:STORM_MSGPLUS_ARCHIVE_FIXTURE=$zip
          python -m unittest discover -s installer -p 'test_setup.py' -v
      - name: Compilar executavel de instalacao unico
        run: pyinstaller --noconfirm --clean --onefile --windowed --uac-admin --name "StormMSN-Setup" installer/storm_msn_setup.py
      - name: Conferir EXE
        shell: pwsh
        run: |
          if (-not (Test-Path dist/StormMSN-Setup.exe)) { throw "EXE ausente" }
          $f=Get-Item dist/StormMSN-Setup.exe
          Write-Output "EXE gerado: $($f.Length) bytes"
          Get-FileHash dist/StormMSN-Setup.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: StormMSN-Setup-Windows
          path: dist/StormMSN-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publicar instalador direto no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wlm2009-setup-v1.0.4
          name: Storm MSN - Windows Live Messenger 2009 - Instalador v1.0.4
          body: |
            Messenger Plus! 5.02 agora usa ZIP sem senha, mantendo a versao adaptada pelo Escargot.
            A instalacao e opcional e desmarcada por padrao.
            SHA-256 do ZIP e do executavel sao validados; nao se aceita ofertas patrocinadas automaticamente.
            Windows 11 24H2 e 25H2: opcao para abrir a correcao oficial Escargot para o erro de lista de contatos.
            Correcao executada somente apos escolha explicita, usando ZIP verificado por SHA-256 da NINA.
            Mantem WLM 2009 original e enderecos privados do Storm MSN. Recomenda reinicio.
            Mantida a correcao de validacao do wlcomm.exe original de 32768 bytes.
            Instalador independente do Storm MSN, sem cliente Tkinter.
            Abre a instalacao original do WLM 2009 (baixada da fonte Escargot com hash fixo)
            e configura o Switcher ImportMe para im.hoststorm.com.br, com backups.
            Status: beta. Compatibilidade deve ser validada em computadores dos usuarios.
            O executavel nao embute nenhum binario proprietario da Microsoft.
          files: dist/StormMSN-Setup.exe
          fail_on_unmatched_files: true
          prerelease: true
