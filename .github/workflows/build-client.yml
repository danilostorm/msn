name: Build Storm MSN Client
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/build-client.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pyinstaller websockets
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name Storm-MSN client/storm_msn.py
      - uses: actions/upload-artifact@v4
        with:
          name: Storm-MSN-Windows
          path: dist/Storm-MSN.exe
          if-no-files-found: error
