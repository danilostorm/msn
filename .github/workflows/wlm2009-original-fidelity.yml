name: WLM 2009 original resource integrity

on:
  push:
    branches:
      - feat/wlm2009-original-fidelity
    paths:
      - 'wlm2009/**'
      - 'integrations/playstor-snes/**'
      - 'front/msn/msnp_sb.py'
      - 'front/msn/http/abservice.py'
      - 'front/msn/tmpl/MsgrConfig.wlm.14.xml'
      - '.github/workflows/wlm2009-original-fidelity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity-tests:
    name: Test local manifests without Microsoft binaries
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic baseline, INI and tamper tests
        shell: powershell
        run: |
          & .\wlm2009\tests\Test-Integridade.ps1
      - name: Unit test WLM 2009 protocol contract (offline)
        shell: powershell
        run: |
          python -m unittest discover -s wlm2009/lab/tests -p 'test_*.py' -v
      - name: Unit test SNES PlayStor direct Edge launch catalog (offline)
        shell: powershell
        run: |
          node --check integrations/playstor-snes/playstor-snes.js
          node integrations/playstor-snes/test-catalog.js
      - name: Test Messenger Plus native games menu bridge
        shell: powershell
        run: |
          node --check wlm2009/plus-playstor/Main.js
          node wlm2009/plus-playstor/tests/test_plus_playstor.js
